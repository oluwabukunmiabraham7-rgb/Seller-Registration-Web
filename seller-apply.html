<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Become a Seller | MARKET EXPRESS</title><link rel="stylesheet" href="seller.css"></head>
<body><header class="top"><a class="brand" href="https://oluwabukunmiabraham7-rgb.github.io/Market-expres/">🎀 MARKET EXPRESS</a><a href="https://oluwabukunmiabraham7-rgb.github.io/Market-expres/">Back to store</a></header><main class="wrap narrow"><section class="card"><p class="eyebrow">SELL ON MARKET EXPRESS</p><h1>Apply to become a seller</h1><p>Create your seller account. <b>You must be approved by MARKET EXPRESS before you can upload products.</b> Submitting this form does not grant seller access.</p><div id="message" class="notice" aria-live="polite"></div><form id="applyForm"><label>Shop / business name<input id="shopName" required maxlength="80" autocomplete="organization"></label><label>Your full name<input id="fullName" required maxlength="80" autocomplete="name"></label><label>Email address<input id="email" type="email" required autocomplete="email"></label><label>Phone number<input id="phone" type="tel" required maxlength="25" autocomplete="tel"></label><label>What do you plan to sell?<select id="category" required><option value="">Choose a category</option><option>Shoes</option><option>Bags</option><option>Perfumes</option><option>Watches</option><option>Clothing</option><option>Accessories</option><option>Home & Living</option><option>Other</option></select></label><label>Short business description<textarea id="description" maxlength="500" rows="3" required></textarea></label><label>Password (at least 8 characters)<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn" id="submitBtn">Submit seller application</button></form><p class="muted">Already registered? <a href="https://oluwabukunmiabraham7-rgb.github.io/market-express-seller-dashboard/seller.html">Open seller dashboard</a></p></section></main><script type="module" src="seller-apply.js"></script></body></html>
